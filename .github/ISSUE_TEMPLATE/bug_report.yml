name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The fields below are the ones that actually make a
        bug reproducible — please fill them in rather than deleting them.

        **Do not paste API keys, tokens, or absolute paths from your machine.**
        Replace them with `<key>` and `<repo>`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, in your own words. Include the exact error text if there is one.
      placeholder: |
        I ran `node src/agent/loop.mjs ...` and it stopped after 2 rounds with
        "PROMPT_OVER_BUDGET: prompt is 16447 chars > LLM_IN_CHARS_MAX 16000".
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: The run should continue past round 2.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem. If it needs a particular savegame, say what is in it.
      placeholder: |
        1. Install the mod with `install.ps1`
        2. Start the bridge with `node src/bridge/bridge.mjs`
        3. Load a savegame at level 12 with ~500 entities
        4. Run `node src/agent/loop.mjs --goal ... --llm --max-rounds 6`
        5. Observe the run halts after round 2
    validations:
      required: true

  - type: input
    id: shapez-version
    attributes:
      label: shapez.io version
      description: Shown in-game, or the Steam build number.
      placeholder: "1.5.6"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v20.11.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 14.5 / Ubuntu 24.04"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which part is involved
      multiple: true
      options:
        - The mod (in-game)
        - The bridge
        - The MCP server
        - The agent / planning loop
        - The GUI
        - Install scripts
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log or transcript
      description: |
        Bridge output, or the `transcript.jsonl` from the run directory. Scrub
        paths and keys before pasting. Long logs can be attached as a file.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed API keys, tokens and absolute paths from everything pasted above.
          required: true
        - label: I checked that this is not already reported in an existing issue.
          required: true
